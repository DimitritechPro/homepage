<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Name - Portfolio</title>
  <meta name="description" content="Personal portfolio and projects showcase">
  <link rel="icon" href="favicon.ico">
  <style>
    /* ========================================
       CONFIGURATION - Edit colors here
       ======================================== */
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #1a1a24;
      --text-primary: #e4e4e7;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --accent: #60a5fa;
      --accent-hover: #3b82f6;
      --border: #27272a;
    }

    /* ========================================
       BASE STYLES
       ======================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      transition: color 0.2s;
    }

    a:hover {
      color: var(--accent-hover);
    }

    /* ========================================
       LAYOUT
       ======================================== */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    header {
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--border);
    }

    header .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    nav {
      display: flex;
      gap: 1.5rem;
    }

    nav a {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    nav a:hover {
      color: var(--text-primary);
    }

    /* ========================================
       HERO SECTION
       ======================================== */
    .hero {
      padding: 5rem 0;
      text-align: center;
    }

    .hero h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, var(--text-primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      font-size: 1.1rem;
      color: var(--text-secondary);
      max-width: 500px;
      margin: 0 auto 2rem;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 1rem;
    }

    .social-links a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      color: var(--text-secondary);
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .social-links a:hover {
      background: var(--bg-card);
      color: var(--text-primary);
      border-color: var(--accent);
    }

    /* ========================================
       PROJECTS SECTION
       ======================================== */
    .projects {
      padding: 3rem 0;
    }

    .projects h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 2rem;
      color: var(--text-primary);
    }

    .project-grid {
      display: grid;
      gap: 1.5rem;
    }

    .project-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.5rem;
      transition: all 0.2s;
    }

    .project-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .project-card h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .project-card h3 a {
      color: var(--text-primary);
    }

    .project-card p {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }

    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .tag {
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      background: var(--bg-card);
      border-radius: 0.25rem;
      color: var(--text-muted);
    }

    /* ========================================
       FOOTER
       ======================================== */
    footer {
      padding: 2rem 0;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    /* ========================================
       RESPONSIVE
       ======================================== */
    @media (max-width: 600px) {
      .hero h1 {
        font-size: 2rem;
      }

      .social-links {
        flex-direction: column;
        align-items: center;
      }

      header .container {
        flex-direction: column;
        gap: 1rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="container">
      <a href="/" class="logo" id="site-name">Your Name</a>
      <nav id="nav-links"></nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1 id="hero-title">Hello, I'm Your Name</h1>
        <p id="hero-description">A passionate developer building cool things on the web.</p>
        <div class="social-links" id="social-links"></div>
      </div>
    </section>

    <section class="projects">
      <div class="container">
        <h2>Projects</h2>
        <div class="project-grid" id="project-grid"></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p id="footer-text"></p>
    </div>
  </footer>

  <script>
    /* ========================================
       CONFIGURATION - Edit your info here!
       ======================================== */
    const CONFIG = {
      // Your name
      name: "Dimitritech",

      // Hero section
      title: "Welcome to Dimitritech!",
      description: "The best tech support on the web.",

      // Navigation links
      navLinks: [] //To use remove the last ] here and uncomment lines below.
      //  { label: "Header 1", url: "#443" },
      //  { label: "Header 2", url: "#443" },
      //  { label: "Header 3", url: "#443" }
      //],

      // Social links (add/remove as needed)
      socialLinks: [
        { label: "Fluid Sim", url: "https://fluid.dimitritech.store", icon: "→" },
        { label: "Jorgen", url: "https://jorgen.dimitritech.store", icon: "→" },
        { label: "Games", url: "https://www.youtube.com/watch?v=xvFZjo5PgG0", icon: "→" }
      ],

      // Projects (add/remove as needed)
      projects: [
        {
          name: "Fluid Sim",
          description: "Fluid Simulation directly in your web browser!.",
          url: "https://fluid.dimitritech.store",
          tags: ["HTML", "CSS", "JS"]
        },
        {
          name: "Games",
          description: "A collection of free games!",
          url: "https://www.youtube.com/watch?v=xvFZjo5PgG0",
          tags: ["C++", "Python", "UE5"]
        }
      ],

      // Footer
      footerText: "© 2025-2026 Dimitritech Group. All rights reserved."
    };

    /* ========================================
       RENDER FUNCTIONS (Don't edit below)
       ======================================== */
    document.getElementById('site-name').textContent = CONFIG.name;
    document.getElementById('hero-title').textContent = CONFIG.title;
    document.getElementById('hero-description').textContent = CONFIG.description;
    document.getElementById('footer-text').textContent = CONFIG.footerText;

    // Render nav links
    const navContainer = document.getElementById('nav-links');
    CONFIG.navLinks.forEach(link => {
      const a = document.createElement('a');
      a.href = link.url;
      a.textContent = link.label;
      navContainer.appendChild(a);
    });

    // Render social links
    const socialContainer = document.getElementById('social-links');
    CONFIG.socialLinks.forEach(link => {
      const a = document.createElement('a');
      a.href = link.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.innerHTML = `${link.label} <span>${link.icon}</span>`;
      socialContainer.appendChild(a);
    });

    // Render projects
    const projectGrid = document.getElementById('project-grid');
    CONFIG.projects.forEach(project => {
      const card = document.createElement('div');
      card.className = 'project-card';
      card.innerHTML = `
        <h3><a href="${project.url}" target="_blank" rel="noopener noreferrer">${project.name}</a></h3>
        <p>${project.description}</p>
        <div class="project-tags">
          ${project.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
        </div>
      `;
      projectGrid.appendChild(card);
    });
  </script>

</body>
</html>
